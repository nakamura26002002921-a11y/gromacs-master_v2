gromacs:
  force_field: "amber99sb"
  water_model: "tip3p"
agent:
  max_attempts: 10
  log_dir: "logs"
lats:
  max_iterations: 20       # MCTSの最大イテレーション数
  max_depth: 5             # 木の最大深さ(修復ステップ数の上限)
  exploration_constant: 1.4  # UCBの探索係数 c
  repair_timeout_sec: 300  # 1修復操作あたりのタイムアウト(秒)
  gmx_timeout_sec: 120     # gmx pdb2gmxのタイムアウト(秒)
  use_llm: true            # falseにすると決定論的MCTSとして動く
